<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时数智人</title>
    <style>
      html, body, #player-container { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eef5f1; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; color: #355247; font: 14px system-ui; }
    </style>
  </head>
  <body>
    <div id="player-container"></div>
    <div id="status">正在连接腾讯云 WebRTC…</div>
    <script src="https://web.sdk.qcloud.com/player/tcplayerlite/release/v2.4.5/TcPlayer-2.4.5.js" charset="utf-8"></script>
    <script>
      (() => {
        const status = document.getElementById("status");
        const streamUrl = new URLSearchParams(location.search).get("url") || "";
        if (!streamUrl.startsWith("webrtc://") || typeof window.TcPlayer !== "function") {
          status.textContent = streamUrl ? "WebRTC 播放器加载失败" : "缺少 WebRTC 播放地址";
          return;
        }
        window.__avatarPlayer = new window.TcPlayer("player-container", {
          webrtc: streamUrl,
          width: "100%",
          height: "100%",
          autoplay: true,
          live: true,
          controls: "none",
          webrtcConfig: { streamType: "auto" },
          listener(message) {
            if (message?.type === "loadedmetadata" || message?.type === "playing") status.remove();
          },
        });
      })();
    </script>
  </body>
</html>
