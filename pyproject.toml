[project]
name = "interviewer"
version = "0.1.0"
description = "Real-time AI interviewer backend MVP"
requires-python = ">=3.9"
dependencies = [
    "celery[redis]>=5.5,<6",
    "fastapi>=0.128.0",
    "httpx>=0.28.0",
    "cryptography>=50.0.0",
    "oss2>=2.19.1,<3",
    "pydantic>=2.7.0",
    "pypdf>=6.16.0",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20",
    "redis>=5,<7",
    "pytest>=8.0.0",
    "uvicorn>=0.39.0",
    "websockets>=14.0",
]

[project.scripts]
interviewer-outbox-worker = "app.workers.outbox:main"
interviewer-celery = "app.workers.celery_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
